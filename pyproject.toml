[project]
name = "atlas"
version = "0.1.0"
description = "ATLAS: Actionable Autonomous Trading, Liquidity, Allocation & Strategy Intelligence platform."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "databento>=0.30.0",
  "polygon-api-client>=1.14.0",
  "ccxt>=4.2.0",
  "polars>=0.20.0",
  "duckdb>=0.10.0",
  "websockets>=12.0",
  "aiohttp>=3.9.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
marketdata = [
  "databento>=0.30.0",
  "polygon-api-client>=1.14.0",
  "ccxt>=4.2.0",
  "polars>=0.20.0",
  "duckdb>=0.10.0",
  "websockets>=12.0",
  "aiohttp>=3.9.0",
]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
atlas-research = "atlas.ai.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --basetemp=.test-runs/pytest-default"
